# version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: f1_data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-agent:
    build: ./ai-agent
    container_name: f1_ai_agent
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "8501:8501"
    depends_on:
      - postgres_db

  airflow_spark:
    build: .  
    container_name: f1_airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_CONN_POSTGRES_CONN_ID=${AIRFLOW_CONN_POSTGRES_CONN_ID}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags   
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
    command: airflow standalone    
    depends_on:
      - postgres_db
volumes:
  postgres_data:
  
